# Hosted Auth/API values applied and verified on 2026-10-20 (Europe/Paris), CLI 2.121.0.
# Unspecified hosted settings are preserved. This file contains no credentials.
[auth]
site_url = "http://localhost:5174"
additional_redirect_urls = ["http://localhost:5173/auth/callback", "http://localhost:5174/auth/callback"]
jwt_expiry = 900
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
otp_length = 6
otp_expiry = 600

[api]
schemas = ['public']
max_rows = 200
