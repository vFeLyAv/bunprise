<path d="M0 840 Q32 822 64 840 T128 840 Q160 822 192 840 T256 840 Q288 822 320 840 T384 840 Q416 822 448 840 T512 840 Q544 822 576 840 T640 840 Q672 822 704 840 T768 840 Q800 822 832 840 T896 840 Q928 822 960 840 T1024 840 L1024 1024 L0 1024 Z" fill="url(#sea)"/>
      <path d="M0 840 Q32 822 64 840 T128 840 Q160 822 192 840 T256 840 Q288 822 320 840 T384 840 Q416 822 448 840 T512 840 Q544 822 576 840 T640 840 Q672 822 704 840 T768 840 Q800 822 832 840 T896 840 Q928 822 960 840 T1024 840" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" opacity=".92"/>
      <g fill="#FFFFFF" opacity=".55"><circle cx="160" cy="930" r="11"/><circle cx="196" cy="968" r="6"/><circle cx="860" cy="944" r="9"/><circle cx="890" cy="980" r="5"/><circle cx="700" cy="1000" r="6"/></g>
<use href="#bunny-paws" transform="translate(512 1131) scale(4.85)"/>

</svg>