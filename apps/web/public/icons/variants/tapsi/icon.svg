      <ellipse cx="25" cy="-61.5" rx="13" ry="10" fill="#F5D6B0"/>
      <path d="M19.54 -59.5 v5.5 M25 -59.5 v5.5 M30.46 -59.5 v5.5" fill="none" stroke="#965A28" stroke-opacity=".38" stroke-width="1.3" stroke-linecap="round"/>
    </g>
  </defs><defs><linearGradient id="bgLilac" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EEE8FC"/><stop offset="1" stop-color="#D2C6F3"/></linearGradient><linearGradient id="tBody" gradientUnits="userSpaceOnUse" x1="0" y1="-165" x2="0" y2="0"><stop offset="0" stop-color="#FFF9F0"/><stop offset="1" stop-color="#F6E3C9"/></linearGradient>
