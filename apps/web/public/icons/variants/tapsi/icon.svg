  <ellipse cx="-32" cy="-96" rx="7.6" ry="9.4" fill="#3A2622"/><circle cx="-29.2" cy="-99.6" r="2.4" fill="#FFFFFF"/>
  <ellipse cx="32" cy="-96" rx="7.6" ry="9.4" fill="#3A2622"/><circle cx="34.8" cy="-99.6" r="2.4" fill="#FFFFFF"/>
