<!--
  Bunprise launch screen (Felix 26.10; docs/design/2026-10-26-splash.md). Lives in apps/web/index.html: the <style>
  in <head>, the <div> as the first element of <body>. packages/mascot/demo/splash/splash.html is the gallery's
  identical copy (apps/web/src/lib/splash.test.ts compares them): change both.
  Pure CSS: it shows with the first paint and animates with no JavaScript (CSP: no inline scripts); main.tsx
  only adds .bps-out (the exit) and removes the element afterwards. Colours: <html data-theme>, else the system.
  Motion: prefers-reduced-motion or <html data-motion="reduce"> = fades only, data-motion="off" = nothing moves.
  Only transform/opacity animate (the compositor keeps them smooth while the app boots); everything is finite;
  if no script ever runs, it hides itself after 10 s.
-->
<style>
#bp-splash{
  /* --k scales movement, --f scales fades (reduce: k 0; off: both 0) */
  --k:1;--f:1;
  /* the app's springs (tokens.css --ease-bouncy / --ease-smooth) */
  --bo:linear(0,.069,.237,.449,.662,.849,.994,1.092,1.146,1.163,1.153,1.127,1.092,1.057,1.026,1.002,.986,.977,.973,.975,.979,.985,.99,.995,1);
  --sm:linear(0,.023,.081,.159,.248,.34,.429,.514,.591,.66,.721,.773,.818,.856,.887,.913,.934,.95,.964,.974,.982,.988,.993,.996,1);
  /* the page backdrop of each theme (tokens.css / navy.css / ocean.css --page-*), so the hand-over shows no seam */
  --t:#F7F0E5;--m:#F3EADC;--b:#F0E6D6;--g1:rgba(255,193,146,.58);--g2:rgba(248,180,170,.46);--g3:rgba(252,206,126,.5);--g4:rgba(204,194,242,.42);
  --ink:#62554A;--sh:0 14px 30px -10px rgba(150,80,20,.42),0 2px 6px rgba(150,80,20,.14);
  position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;contain:strict;will-change:opacity;
  background:radial-gradient(78% 36% at -4% -2%,var(--g1),transparent 72%),radial-gradient(70% 34% at 104% 30%,var(--g2),transparent 72%),radial-gradient(84% 34% at 4% 98%,var(--g3),transparent 72%),radial-gradient(72% 30% at 102% 80%,var(--g4),transparent 72%),linear-gradient(var(--t),var(--m) 55%,var(--b));
  color:var(--ink);font:600 17px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;letter-spacing:-.01em;
  -webkit-user-select:none;user-select:none;
  transition:opacity calc((.2s + .12s*var(--k))*var(--f)) cubic-bezier(.45,0,.2,1) calc(40ms*var(--k));
  animation:bps-failsafe 1ms 10s forwards
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) #bp-splash{--t:#1C1612;--m:#18130F;--b:#15100D;--g1:rgba(255,150,84,.13);--g2:rgba(232,118,124,.1);--g3:rgba(236,172,82,.1);--g4:rgba(150,132,226,.09);--ink:#C3B5A6;--sh:0 14px 34px -8px rgba(0,0,0,.6)}}
:root[data-theme=dark] #bp-splash{--t:#1C1612;--m:#18130F;--b:#15100D;--g1:rgba(255,150,84,.13);--g2:rgba(232,118,124,.1);--g3:rgba(236,172,82,.1);--g4:rgba(150,132,226,.09);--ink:#C3B5A6;--sh:0 14px 34px -8px rgba(0,0,0,.6)}
:root[data-theme=navy] #bp-splash{--t:#131A2D;--m:#0F1527;--b:#0D1322;--g1:rgba(96,140,255,.14);--g2:rgba(150,120,255,.1);--g3:rgba(70,170,230,.09);--g4:rgba(255,150,84,.07);--ink:#AEB9CF;--sh:0 14px 34px -8px rgba(0,0,0,.6)}
:root[data-theme=ocean] #bp-splash{--t:#15191F;--m:#111418;--b:#0F1215;--g1:rgba(80,160,255,.12);--g2:rgba(90,200,250,.08);--g3:rgba(120,140,255,.08);--g4:rgba(80,160,255,.05);--ink:#AAB4C2;--sh:0 14px 34px -8px rgba(0,0,0,.6)}
:root[data-theme=black] #bp-splash{--t:#000;--m:#000;--b:#000;--g1:transparent;--g2:transparent;--g3:transparent;--g4:transparent;--ink:#B0B0B8;--sh:0 14px 34px -8px rgba(0,0,0,.6)}
@media (prefers-reduced-motion:reduce){:root:not([data-motion=full]) #bp-splash{--k:0}}
:root[data-motion=reduce] #bp-splash{--k:0}
:root[data-motion=off] #bp-splash{--k:0;--f:0}
@supports not (animation-timing-function:linear(0,1)){#bp-splash{--bo:cubic-bezier(.34,1.56,.64,1);--sm:cubic-bezier(.2,.7,.3,1)}}
/* the app icon (public/icons/icon.svg) as layers: head behind the edge, paws in front; Pompon peeks up */
.bps-mark{display:flex;flex-direction:column;align-items:center;gap:18px;margin-bottom:7vh;
  animation:bps-in-fade calc(.22s*var(--f)) ease-out calc(60ms*var(--f)) both,bps-in-grow calc(.35s*var(--k)) var(--sm) calc(60ms*var(--k)) both}
.bps-mark b{font:inherit}
.bps-tile{position:relative;width:120px;height:120px;border-radius:27px;overflow:hidden;isolation:isolate;background:linear-gradient(#F6C07E,#F0A04B);box-shadow:var(--sh)}
.bps-tile div,.bps-tile svg{position:absolute;inset:0;width:100%;height:100%}
.bps-edge{position:absolute;inset:82% 0 0;background:#E5923D}
.bps-head{animation:bps-in-peek calc(.48s*var(--k)) var(--bo) calc(80ms*var(--k)) both}
.bps-eyes{transform-origin:50% 64.5%;animation:bps-blink calc(1.6s*var(--k)) linear calc(.8s*var(--k)) both}
.bps-duck,.bps-paws{transition:transform calc(.22s*var(--k)) cubic-bezier(.5,0,.8,.5),opacity calc(.12s*var(--k)) ease-out}
#bp-splash.bps-out{opacity:0;pointer-events:none}
.bps-out .bps-duck{transform:translateY(calc(34%*var(--k)))}
.bps-out .bps-paws{opacity:calc(1 - var(--k));transform:translateY(calc(4%*var(--k)))}
@keyframes bps-in-fade{from{opacity:0}}
@keyframes bps-in-grow{from{transform:scale(.94)}}
@keyframes bps-in-peek{from{transform:translateY(30%)}}
@keyframes bps-blink{9%,16%,81%,88%{transform:none}12.5%,84.5%{transform:scaleY(.1)}}
@keyframes bps-failsafe{to{visibility:hidden}}
</style>
  </head>
